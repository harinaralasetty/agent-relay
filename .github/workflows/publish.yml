name: Publish Python package (manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing reviewed version tag, for example v0.3.0a1'
        required: true
        type: string
      target:
        description: 'Package index; TestPyPI first'
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --locked --python 3.12 --extra models
      - name: Verify version tag
        env:
          RELAY_RELEASE_TAG: ${{ inputs.tag }}
        run: |
          uv run python -c 'import os; from agent_relay import __version__; assert os.environ["RELAY_RELEASE_TAG"] == "v" + __version__, "Tag must match package version"'
          git show-ref --verify "refs/tags/$RELAY_RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/${RELAY_RELEASE_TAG}^{commit}")"
      - run: uv run --extra models ruff check .
      - run: uv run --extra models ruff format --check .
      - run: uv run --extra models pytest -q
      - run: uv build
      - run: uvx --from 'twine==7.0.0' twine check dist/*
      - name: Qualify clean base and optional installations
        run: |
          relay_wheel_path=$(python -c 'import glob; paths=glob.glob("dist/*.whl"); assert len(paths)==1; print(paths[0])')
          uv venv .wheel-venv --python 3.12
          uv pip install --python .wheel-venv/bin/python "$relay_wheel_path"
          .wheel-venv/bin/python scripts/qualify_install.py
          uv venv .models-wheel --python 3.12
          uv pip install --python .models-wheel/bin/python "$relay_wheel_path[models]"
          .models-wheel/bin/python scripts/qualify_install.py --models
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.target }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist/
      - name: Upload to TestPyPI
        if: inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Upload to PyPI
        if: inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
